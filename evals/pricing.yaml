# Prices per million tokens, used by evals/model_sweep.py to fill cost_usd in results/cost_log.jsonl.
#
# source_checked: false means these numbers have not been checked against the pricing page.
# They are placeholders. The real client refuses to run while any used model is unchecked.
# Session C fills them in from the pricing page and flips the flag before the first paid run.
# Fake runs always log cost 0, whatever is written here.

currency: USD
# The Batch API bills at a discount. Checked at the same time as the prices.
batch_discount:
  multiplier: 0.5
  source_checked: true
  note: Checked 2026-09-21 and 2026-09-22, docs/notes/model_ids.md.

models:
  claude-haiku-4-5-20251001:
    input_per_million: 1.00
    output_per_million: 5.00
    source_checked: true
    note: Checked 2026-09-21 and 2026-09-22, docs/notes/model_ids.md.
  claude-sonnet-5:
    input_per_million: 2.00
    output_per_million: 10.00
    source_checked: true
    note: Checked 2026-09-21 and 2026-09-22, docs/notes/model_ids.md.
  claude-opus-5:
    input_per_million: 5.00
    output_per_million: 25.00
    source_checked: true
    note: Checked 2026-09-21 and 2026-09-22, docs/notes/model_ids.md.
