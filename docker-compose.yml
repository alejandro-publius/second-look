services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secondlook
      POSTGRES_PASSWORD: secondlook-local-only
      POSTGRES_DB: secondlook
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondlook -d secondlook"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://secondlook:secondlook-local-only@db:5432/secondlook
      PUBLIC_WEB_ORIGIN: http://localhost:3000
      API_ORIGIN: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: apps/web
    environment:
      NEXT_PUBLIC_API_ORIGIN: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
volumes:
  dbdata:
