name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # make check runs make secrets, which reads the whole history with gitleaks, and
      # .gitleaksignore names each finding by the commit that added it, so fetch every commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            worker/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache FHIR packages and validator
        uses: actions/cache@v4
        with:
          path: |
            ~/.fhir/packages
            fhir/tools
          key: fhir-${{ hashFiles('fhir/ig.lock') }}
      # gitleaks for make secrets, the release pinned by its published SHA-256.
      - name: Install gitleaks 8.30.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - run: uv sync --frozen
      - run: cd apps/web && npm ci
      # design-check drives the built app in Chromium to measure tap targets, so the runner
      # needs the browser Playwright pins, not only the package.
      - run: cd apps/web && npx playwright install --with-deps chromium
      # The Worker's package and its e2e live on depth until depth merges, so these three steps
      # run only where worker/package-lock.json exists. Same file on main and depth.
      - if: hashFiles('worker/package-lock.json') != ''
        run: cd worker && npm ci
      - run: make check
      # The Worker end to end under wrangler dev with a local D1 and KV, rain from a stub, no
      # login and no network beyond this runner (Update 10 answer A3). Wrangler 4.135 needs
      # Node 22; the web build above keeps its Node 20 pin (PLAN.md), so the switch comes last.
      - if: hashFiles('worker/package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: hashFiles('worker/package-lock.json') != ''
        run: cd worker && npm run e2e
