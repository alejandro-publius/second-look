name: check
on:
  push:
    branches: [main, depth]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # make check runs make secrets, which reads the whole history with gitleaks, and
      # .gitleaksignore names each finding by the commit that added it, so fetch every commit.
      - name: Check out every commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python 3.12 with uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Node 20 for the web build
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            worker/package-lock.json
            tools/diagrams/package-lock.json
      - name: Java 17 for the HL7 validator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache FHIR packages and validator
        uses: actions/cache@v4
        with:
          path: |
            ~/.fhir/packages
            fhir/tools
          key: fhir-${{ hashFiles('fhir/ig.lock') }}
      # gitleaks for make secrets, the release pinned by its published SHA-256.
      - name: Install gitleaks 8.30.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Python packages
        run: uv sync --frozen
      - name: Web packages
        run: cd apps/web && npm ci
      # design-check drives the built app in Chromium to measure tap targets, so the runner
      # needs the browser Playwright pins, not only the package.
      - name: Chromium for the design check and the end to end tests
        run: cd apps/web && npx playwright install --with-deps chromium
      # make diagrams draws docs/diagrams/*.mmd again with the Mermaid CLI pinned here, in the
      # Chromium installed just above. Puppeteer downloads no browser of its own
      # (tools/diagrams/.puppeteerrc.cjs).
      - name: The pinned diagram renderer
        run: cd tools/diagrams && npm ci
      - name: Worker packages
        run: cd worker && npm ci
      - name: make check (lint, types, tests, FHIR validation, claims, web build, design gate)
        run: make check
      # Every AI number in results/ graded again from the committed raw replies, and every
      # synthetic result made again from its seed, with no key and no network. make check does not
      # do this, so a synthetic p value flipped to significant would pass every step of it.
      - name: make reproduce (every AI number graded again from its raw replies)
        run: make reproduce
      # The web end to end on a phone viewport with a mocked API: the test flow, judge mode, the
      # check, the walks, keyboard only, reflow and axe on every screen it reaches. The
      # /accessibility page says the build fails on a serious axe finding; this step is why.
      - name: Web end to end on a phone viewport
        run: make e2e
      # The Worker end to end under wrangler dev with a local D1 and KV, rain from a stub, no
      # login and no network beyond this runner (Update 10 answer A3). Wrangler 4.135 needs
      # Node 22; the web build above keeps its Node 20 pin (PLAN.md), so the switch comes last.
      - name: Node 22 for wrangler
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Worker end to end under wrangler dev
        run: cd worker && npm run e2e
