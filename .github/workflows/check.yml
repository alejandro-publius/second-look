name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache FHIR packages and validator
        uses: actions/cache@v4
        with:
          path: |
            ~/.fhir/packages
            fhir/tools
          key: fhir-${{ hashFiles('fhir/ig.lock') }}
      - run: uv sync --frozen
      - run: cd apps/web && npm ci
      - run: make check
