# A daily dump of the live D1 database, kept as a private artifact. Nobody computes outcomes
# from a backup: only evals/usability_analysis.py does that, and it refuses before the data lock
# and without the prereg-v1 tag. See docs/DATA_HANDLING.md.
name: backup

# Backups run on the Mac through launchd (scripts/backup_d1.sh), not here.
# Manual only until the two secrets exist (Update 10 answer A2). A scheduled run without them
# would fail every morning and teach everyone to ignore a red tick. Put the schedule back the
# day Alex adds CLOUDFLARE_D1_READ_TOKEN and CLOUDFLARE_ACCOUNT_ID, then run it once and do the
# restore drill; the launch gate in scripts/preflight.py reads results/backup_drill.json.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Export the database
        env:
          # A token scoped to D1 read on this one account and nothing else.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p backup
          npx --yes wrangler@4 d1 export second-look --remote \
            --output "backup/second-look-$(date -u +%Y%m%dT%H%M%SZ).sql"
          ls -la backup
      - name: Keep it as a private artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: backup/
          retention-days: 30
          if-no-files-found: error
