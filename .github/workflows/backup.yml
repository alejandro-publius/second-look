# A dump of the live D1 database as a GitHub Actions artifact, made only by hand and only while the
# repository is private. Anyone signed in to GitHub can download a public repository's artifacts,
# and this one turns public on Sep 30, so on a public repository the job is skipped and the dump
# stays out of Actions artifacts. An artifact made while private turns public with the repository,
# so make none before the flip. Nobody computes outcomes from a backup: only
# evals/usability_analysis.py does that, and it refuses before the data lock and without the
# prereg-v1 tag. See docs/DATA_HANDLING.md, Backups.
name: backup

# The daily backup runs on the Mac through launchd (scripts/backup_d1.sh), not here.
# Manual only: it needs CLOUDFLARE_D1_READ_TOKEN and CLOUDFLARE_ACCOUNT_ID, which were never added
# (Update 10 answer A2), and a schedule on the public repository would publish the dump.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    # Critic round 14 A03: never on a public repository, where the artifact would not be private.
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Export the database
        env:
          # A token scoped to D1 read on this one account and nothing else.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p backup
          npx --yes wrangler@4 d1 export second-look --remote \
            --output "backup/second-look-$(date -u +%Y%m%dT%H%M%SZ).sql"
          ls -la backup
      - name: Keep it as a private artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: backup/
          retention-days: 30
          if-no-files-found: error
