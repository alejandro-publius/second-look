[project]
name = "second-look"
version = "0.1.0"
description = "A two minute test that scores volunteer creek assessors and carries the score into OneAquaHealth FHIR records."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "numpy>=2.0",
  "scipy>=1.14",
  "pandas>=2.2",
  "duckdb>=1.1",
  "pillow>=10.4",
  "httpx>=0.27",
  "matplotlib>=3.9",
  "anthropic>=0.40",
  "python-multipart>=0.0.9",
  "mcp>=2.2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.112",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pandas-stubs",
  "types-requests",
  "respx>=0.23.1",
  "yt-dlp>=2026.1.1",
  "opencv-python-headless>=4.10,<6",
  "pyobjc-framework-Vision>=11; sys_platform == 'darwin'",
  "mutmut>=3.8.0",
  "opentimestamps-client>=0.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "apps", "evals", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["core", "apps/api", "apps/mcp", "evals", "scripts"]
addopts = "-q -p no:cacheprovider"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

# make mutation (scripts/mutation.py): mutmut changes the four modules that decide, one small
# change at a time, and core's own tests must notice each one. It works in mutants/, which git
# ignores. The tests read content, the FHIR sources, the photo manifest, the pass table and two eval
# helpers, so those are copied in beside core.
[tool.mutmut]
source_paths = ["core"]
only_mutate = ["core/gate.py", "core/followups.py", "core/scoring.py", "core/fhir_emit.py"]
pytest_add_cli_args_test_selection = ["core/tests"]
also_copy = ["content", "fhir", "photos", "results", "evals", "conftest.py"]
use_git_change_detection = false
# This test reads the imports in core/followups.py's source, and mutmut's copy imports mutmut, so
# it can only fail there. make check still runs it on the real file.
pytest_add_cli_args = [
  "--deselect",
  "core/tests/test_harden_followups_properties.py::test_the_selector_and_what_it_imports_load_no_network_or_model_library",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["fhir/ig-src", "apps/web", "results", "photos", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["fhir/ig-src", "apps/web", "\\.venv"]
