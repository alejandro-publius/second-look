# Lesson for dug_out_channel. Photo ids are the real photos fetched on 2026-09-21 (Update 11b).
# Captions are written from what each source page says about its own photo, so Alex checks them
# against the picture before approving. approved stays false until he does.
feature: dug_out_channel
approved: false
rule_of_thumb: "Straight, even banks, same width, flat water: someone dug this channel."
source: "https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/1093961/RHS-manual-2003_2022-reprint-LIT-1758.pdf"
contrast_pairs:
  # Pair A. Assume: the Aufsess, a meandering reach. Actual: Misteguay Creek, a straight cut channel.
  - assume_photo_id: ph-channel-06
    actual_photo_id: ph-channel-05
    assume_caption: "Bends, gravel and changing width look untidy. This is how a stream shapes itself when nobody stops it."
    actual_caption: "Straight from edge to edge, both banks at one even slope, the same width all along. A machine cut this."
    marks:
      - { x: 0.5, y: 0.5, label: "PLACEHOLDER: the straight line" }
  # Pair B. Assume: Hanshaeger Bach, a meander. Actual: Herringer Bach, a straightened course.
  - assume_photo_id: ph-channel-08
    actual_photo_id: ph-channel-07
    assume_caption: "The brook swings left and right across its meadow. Nobody set that line. Left alone."
    actual_caption: "A straightened course running arrow straight between trimmed banks. Dug out, even with grass growing on top."
    marks:
      - { x: 0.5, y: 0.5, label: "PLACEHOLDER: the even banks" }
practice:
  # A small canalised stream at Butler's Hill: straight, narrow, even.
  photo_id: ph-channel-09
  gold: present
  feedback_correct: "Right. Straight, narrow and the same width all along. Dug out."
  feedback_wrong: "Follow the line of the water. It runs straight and keeps one width the whole way. Dug out."
practice_marks:
  - { x: 0.5, y: 0.5, label: "PLACEHOLDER: the even width" }
