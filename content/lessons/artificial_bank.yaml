# Lesson for artificial_bank. Photo ids are the real photos fetched on 2026-09-21 (Update 11b).
# Captions are written from what each source page says about its own photo, so Alex checks them
# against the picture before approving. approved stays false until he does.
# Cue source: River Habitat Survey manual 2003 (2022 reprint), Section E, "Reinforced bank (RI)".
# The app's own option reads "Artificial (concrete or stones with concrete)", so the lesson
# centres on concrete. No laid stone photo is in the test set: the app gives it its own category.
feature: artificial_bank
approved: false
rule_of_thumb: "Under the plants, look for concrete or stones set in concrete."
source: "https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/1093961/RHS-manual-2003_2022-reprint-LIT-1758.pdf"
contrast_pairs:
  # Pair A. Assume: Afon Annell, an eroded earth bank. Actual: Bell Creek, a concrete channel.
  - assume_photo_id: ph-bank-06
    actual_photo_id: ph-bank-05
    assume_caption: "Bare soil, roots and a slumped edge look like damage. This is a natural bank doing its job."
    actual_caption: "Straight grey walls run down both sides. That is concrete, not soil. A built bank."
    marks:
      - { x: 0.5, y: 0.5, label: "PLACEHOLDER: the built edge" }
  # Pair B. Assume: Whiteknowe Head Burn, raw but natural. Actual: Hale and Permanente confluence, dry concrete.
  - assume_photo_id: ph-bank-08
    actual_photo_id: ph-bank-07
    assume_caption: "A raw cut bank above a small burn. Nothing was built here. The stream is moving its own earth."
    actual_caption: "No water on the day, but the sides are still smooth grey concrete. Built banks stay built when a creek is dry."
    marks:
      - { x: 0.5, y: 0.5, label: "PLACEHOLDER: the concrete side" }
practice:
  # Iron Bark Creek, Wallsend: a concrete low flow channel in a mown reserve.
  photo_id: ph-bank-09
  gold: present
  feedback_correct: "Right. The flat grey strip the water runs in is concrete. A built bank."
  feedback_wrong: "Look at the middle of the grass. That flat grey strip the water runs in is concrete. Built."
practice_marks:
  - { x: 0.5, y: 0.5, label: "PLACEHOLDER: the concrete channel" }
