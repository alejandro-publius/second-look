# Region pack. A species may be named on screen when two things hold, and any team member can
# check them: the photo carries a research grade iNaturalist identification, and the species has a
# page on the Cal-IPC Inventory. The name shown is Cal-IPC's common name (Update 11C item 2).
# The invasive plant list was approved for the team by Alex Velazquez on 2026-09-25 (UPDATE_30
# section 3): every species below was checked against its Cal-IPC Inventory profile, linked on its
# own line, and its iNaturalist taxon id was looked up on 2026-09-24. See docs/DECISIONS.md.
region: california-bay-area
name: "California, San Francisco Bay Area"
approved: true
approved_by: "the team, Alex Velazquez, 2026-09-25"
source: "https://www.cal-ipc.org/plants/inventory/"
invasive_plants:
  - common_name: "Giant reed"
    latin_name: "Arundo donax"
    inaturalist_taxon_id: 64017
    cal_ipc_rating: "High"
    source: "https://www.cal-ipc.org/plants/profile/arundo-donax-profile/"
    note: "Profile: threatens riparian ecosystems and wetlands throughout California."
  - common_name: "English ivy"
    latin_name: "Hedera helix"
    inaturalist_taxon_id: 55882
    cal_ipc_rating: "High"
    source: "https://www.cal-ipc.org/plants/profile/hedera-helix-profile/"
    note: "Profile: grows vigorously in forests and stops understory plants and new trees from coming back."
  - common_name: "Algerian ivy"
    latin_name: "Hedera canariensis"
    inaturalist_taxon_id: 64113
    cal_ipc_rating: "High"
    source: "https://www.cal-ipc.org/plants/profile/hedera-canariensis-profile/"
    note: "Profile: along the coast; same habit as English ivy. Hard to tell apart by eye; the team kept both on the list approved 2026-09-25."
  - common_name: "Cape ivy"
    latin_name: "Delairea odorata"
    inaturalist_taxon_id: 53208
    cal_ipc_rating: "High"
    source: "https://www.cal-ipc.org/plants/profile/delairea-odorata-profile/"
    note: "Profile: especially problematic in coastal riparian areas; forms dense mats over trees and shrubs."
  - common_name: "Himalayan blackberry"
    latin_name: "Rubus armeniacus"
    inaturalist_taxon_id: 61317
    cal_ipc_rating: "High"
    source: "https://www.cal-ipc.org/plants/profile/rubus-armeniacus-profile/"
    note: "Profile: coast ranges, Central Valley, Sierra Nevada. No riparian note on the profile; common on Bay Area creek banks in our experience; kept on the list approved 2026-09-25."
  - common_name: "French broom"
    latin_name: "Genista monspessulana"
    inaturalist_taxon_id: 53403
    cal_ipc_rating: "High"
    source: "https://www.cal-ipc.org/plants/profile/genista-monspessulana-profile/"
    note: "Profile: forms dense stands, raises fire hazard, seed is long lived. Checked 2026-09-21 for Update 11b."
  - common_name: "Periwinkle"
    latin_name: "Vinca major"
    inaturalist_taxon_id: 53326
    cal_ipc_rating: "Moderate"
    source: "https://www.cal-ipc.org/plants/profile/vinca-major-profile/"
    note: "Profile: riparian zones are particularly sensitive; vine fragments break off and start new patches downstream."
  - common_name: "Fennel"
    latin_name: "Foeniculum vulgare"
    inaturalist_taxon_id: 53052
    cal_ipc_rating: "Moderate"
    source: "https://www.cal-ipc.org/plants/profile/foeniculum-vulgare-profile/"
    note: "Profile: alters grassland, coastal scrub, riparian and wetland communities."
  - common_name: "Poison hemlock"
    latin_name: "Conium maculatum"
    inaturalist_taxon_id: 52998
    cal_ipc_rating: "Moderate"
    source: "https://www.cal-ipc.org/plants/profile/conium-maculatum-profile/"
    note: "Profile: occasionally in riparian forests and floodplains, prefers disturbed areas. Do not touch it."
  - common_name: "Tree of heaven"
    latin_name: "Ailanthus altissima"
    inaturalist_taxon_id: 57278
    cal_ipc_rating: "Moderate"
    source: "https://www.cal-ipc.org/plants/profile/ailanthus-altissima-profile/"
    note: "Profile: coast and foothills, disturbed semi-natural habitats. No riparian note on the profile."
  - common_name: "Jubata grass"
    latin_name: "Cortaderia jubata"
    inaturalist_taxon_id: 52714
    cal_ipc_rating: "High"
    source: "https://www.cal-ipc.org/plants/profile/cortaderia-jubata-profile/"
    note: "Profile: dunes, bluffs and disturbed areas. No riparian note on the profile; kept on the list approved 2026-09-25."
not_listed:
  - common_name: "Small-leaf spiderwort"
    latin_name: "Tradescantia fluminensis"
    note: "Named on the OneAquaHealth factsheet XI as a European riparian invader. Not found in the Cal-IPC Inventory on 2026-09-20: the profile URL returned 404 and the site search returned nothing. Left out of the list approved 2026-09-25, which keeps only plants with a Cal-IPC profile."

# Creeks and their reaches (Update 10B answer 1). Each creek has a readable slug, so the analyst's
# link reads /city?creek=strawberry-creek; the store keeps its own generated ids and this list is
# joined to them at read time by core/regions.py. `flows_into` names the reach below; the
# downstream note appears only where it is set. `bbox` is [south, west, north, east] in degrees,
# hand filled from public maps and approximate: a precise pin is placed by the first box that holds
# it, a coarse pin is placed on the creek only. Reaches are listed from the hills to the Bay.
creeks:
  - slug: strawberry-creek
    name: Strawberry Creek
    source: "Hand filled 2026-09-21 from public maps of the UC Berkeley campus and the City of Berkeley. Boxes are approximate."
    reaches:
      - slug: south-fork-canyon
        name: South Fork, Strawberry Canyon
        flows_into: south-fork-campus
        bbox: [37.8690, -122.2530, 37.8780, -122.2350]
      - slug: south-fork-campus
        name: South Fork, central campus
        flows_into: campus-west
        bbox: [37.8695, -122.2645, 37.8730, -122.2530]
      - slug: north-fork-campus
        name: North Fork, campus
        flows_into: campus-west
        bbox: [37.8731, -122.2645, 37.8775, -122.2530]
      - slug: campus-west
        name: Below the forks, west campus
        flows_into: downtown-culvert
        bbox: [37.8700, -122.2670, 37.8735, -122.2645]
      - slug: downtown-culvert
        name: Downtown culvert
        flows_into: strawberry-creek-park
        bbox: [37.8660, -122.2860, 37.8740, -122.2670]
      - slug: strawberry-creek-park
        name: Strawberry Creek Park
        flows_into: west-culvert
        bbox: [37.8655, -122.2905, 37.8690, -122.2860]
      - slug: west-culvert
        name: West Berkeley culvert, to the Bay
        flows_into: null
        bbox: [37.8600, -122.3200, 37.8720, -122.2905]
