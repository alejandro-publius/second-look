    wording_source: app_public_bundle
    verified_against_app: true
    source: "app public bundle, c5a15e8ebf91, 2026-09-26"
    feature: null
    fhir: { code_system: oah, code: riparianVegetation }
  - id: feelings
    section: feelings
    type: sliders
    text: "Which feeling(s) best describe your experience?"
    sliders: [joy, serenity, anger, fear]
    allow_not_applicable: true
    wording_source: app_public_bundle
    verified_against_app: true
    source: "app public bundle, c5a15e8ebf91, 2026-09-26"
    feature: null
    fhir: null
  - id: overall_rating
    section: overall
    type: choice
    text: "Provide an overall assessment of the stream ecosystem health (choose one of the below possibilities)"
    options:
      - { id: good, label: "Good quality", description: "The ecosystem components are there: riparian vegetation, natural channel, good water quality, biodiversity", value: good }
      - { id: moderate, label: "Moderate quality", description: "Some alterations, still biodiverse, with vegetation in the margins, water looks good...", value: moderate }
      - { id: poor, label: "Poor quality", description: "Highly modified / artificialized, loss of riparian vegetation, loss of habitats, polluted", value: poor }
    wording_source: app_public_bundle
    verified_against_app: true
    source: "app public bundle, c5a15e8ebf91, 2026-09-26"
    feature: null
    fhir: null
    rating_check: true
