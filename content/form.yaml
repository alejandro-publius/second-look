# The guided creek check. Mirrors the official OneAquaHealth Citizen Science App in its order and words.
# wording_source app_public_bundle means the question, the answers and the section title are quoted from
# the app's public translation bundle, as content/app_strings.json records with the app key of each
# string; verified_against_app: true with source says which bundle and when (docs/notes/app_strings.md).
# `make app-strings-check` fetches the bundle again and fails if a quoted string has changed. The words
# belong to the OneAquaHealth project and are credited to the OneAquaHealth Citizen Science App.
# Two edits, the same in every language: the answer letters such as (A) are dropped, and the barriers
# question drops its note about the app's example pictures. Ids are stable: they become FHIR linkIds.
# Option values map to FHIR: present / absent / cant_tell, or a coded choice.
version: 1
sections:
  - id: what_you_see
    title: "What do you see from where you stand (in ca. 100m)?"
  - id: water
    title: "How is the water?"
  - id: margins
    title: "In the margins/riparian zone (5-10m from the channel banktop)"
  - id: feelings
    title: "How do you feel here?"
  - id: overall
    title: "Overall"
items:
  - id: channel_form
    section: what_you_see
    type: choice
    name: "Channel Form"
    text: "The channel form is..."
    options:
      - { id: flat, label: "Flat", value: flat }
      - { id: u_shape, label: "U Shape", value: u_shape }
      - { id: v_shape, label: "V Shape", value: v_shape }
      - { id: not_sure, label: "I’m not sure", value: cant_tell }
    wording_source: app_public_bundle
    verified_against_app: true
    source: "app public bundle, c5a15e8ebf91, 2026-09-26"
    feature: null
    fhir: { code_system: oah, code: morophology }
  - id: bottom_type
    section: what_you_see
    type: choice
    name: "Bottom Type"
    text: "The bottom of the wet channel is…"
    options:
      - { id: natural, label: "Natural", value: absent }
      - { id: artificial, label: "Artificial (concrete or stones with concrete)", value: present }
      - { id: not_sure, label: "I’m not sure", value: cant_tell }
    wording_source: app_public_bundle
    verified_against_app: true
    source: "app public bundle, c5a15e8ebf91, 2026-09-26"
    feature: null
    fhir: { code_system: oah, code: morophology }
  # TODO-TEAM-CONFIRM: laid stone counts as a built bank. The River Habitat Survey treats it as
  # reinforcement. We keep the app's three bank types and call none of them natural, and no laid
  # stone photo goes in the test set because the app gives it a category of its own.
  - id: bank_type
    section: what_you_see
    type: choice
    name: "Bank Type"
    text: "The banks of the channel are…"
    short_label: "artificial banks"
    options:
      - { id: natural, label: "Natural", value: absent }
      - { id: artificial, label: "Artificial (concrete or stones with concrete)", value: present }
      - { id: laid_stones, label: "Layed stones with no concrete", value: absent }
      - { id: not_sure, label: "I’m not sure", value: cant_tell }
    wording_source: app_public_bundle
    verified_against_app: true
    source: "app public bundle, c5a15e8ebf91, 2026-09-26"
    feature: artificial_bank
    fhir: { code_system: sl, code: artificial-bank, category: morophology }
  - id: habitats
    section: what_you_see
    type: multi
    name: "Habitats"
    text: "Are there any habitats present?"
    options:
      - { id: sand_banks, label: "Sand banks", value: sand_banks }
      - { id: sand_islands, label: "Sand islands", value: sand_islands }
      - { id: stone_deposits, label: "Stone deposits", value: stone_deposits }
      - { id: riffles, label: "Riffles, rapids, falls", value: riffles }
      - { id: aquatic_vegetation, label: "Aquatic vegetation", value: aquatic_vegetation }
    wording_source: app_public_bundle
    verified_against_app: true
    source: "app public bundle, c5a15e8ebf91, 2026-09-26"
    feature: null
    fhir: { code_system: oah, code: morophology }
  - id: natural_debris
    section: what_you_see
    type: multi
    name: "Natural Debris"
    text: "Are there any natural debris present?"
    options:
      - { id: fallen_trees, label: "Fallen trees", value: fallen_trees }
      - { id: fallen_branches, label: "Fallen branches", value: fallen_branches }
      - { id: leaf_deposits, label: "Deposits of fallen leaves", value: leaf_deposits }
    wording_source: app_public_bundle
    verified_against_app: true
    source: "app public bundle, c5a15e8ebf91, 2026-09-26"
    feature: null
    fhir: { code_system: oah, code: morophology }
  - id: water_flow
    section: what_you_see
    type: choice
    name: "Water Flow"
    text: "How is the water flowing"
    options:
      - { id: fast, label: "Fast (with waves or high velocity)", value: fast }
      - { id: slow, label: "Slow", value: slow }
      - { id: stagnant, label: "Stagnant/intermittent", value: stagnant }
      - { id: dry, label: "Dry", value: dry }
      - { id: not_sure, label: "I’m not sure", value: cant_tell }
    wording_source: app_public_bundle
    verified_against_app: true
    source: "app public bundle, c5a15e8ebf91, 2026-09-26"
    feature: null
    fhir: { code_system: oah, code: hydrology }
  - id: water_aspect
    section: water
    type: choice
    name: "Water Aspect"
    text: "How is the water?"
    options:
      - { id: clear, label: "Clear/transparent", value: absent }
      - { id: muddy, label: "Muddy/turbid", value: present }
      - { id: foam, label: "Has foam", value: present }
      - { id: colour, label: "Has colors/altered color", value: present }
      - { id: not_sure, label: "I’m not sure", value: cant_tell }
    wording_source: app_public_bundle
    verified_against_app: true
    source: "app public bundle, c5a15e8ebf91, 2026-09-26"
    feature: null
    fhir: { code_system: oah, code: foam }
  - id: water_withdrawal
    section: water
    type: yesno
    name: "Water Withdrawal"
    text: "Is there any kind of obvious water collection, use, removal from the stream?"
    wording_source: app_public_bundle
    verified_against_app: true
    source: "app public bundle, c5a15e8ebf91, 2026-09-26"
    feature: null
    fhir: { code_system: oah, code: hydrology }
  - id: barriers
    section: water
    type: yesno
    name: "Barriers"
    text: "Do you see any dams or other transversal artificial barriers?"
    wording_source: app_public_bundle
    verified_against_app: true
    source: "app public bundle, c5a15e8ebf91, 2026-09-26"
    feature: null
    fhir: { code_system: oah, code: morophology }
  - id: draining_pipes
    section: water
    type: yesno
    name: "Draining Pipes"
    text: "Are there pipes draining polluted water into the stream?"
    wording_source: app_public_bundle
    verified_against_app: true
    source: "app public bundle, c5a15e8ebf91, 2026-09-26"
    feature: pipe_running
    fhir: { code_system: sl, code: pipe-running, category: hydrology }
  - id: sewage_discharge
    section: water
    type: yesno
    short_label: "a sewage discharge"
    name: "Sewage discharge"
    text: "Is there any kind of water entry or discharge of sewage?"
    wording_source: app_public_bundle
    verified_against_app: true
    source: "app public bundle, c5a15e8ebf91, 2026-09-26"
    feature: pipe_running
    fhir: { code_system: sl, code: pipe-running, category: hydrology }
  - id: construction
    section: water
    type: yesno
    name: "Construction"
    text: "Is there any construction/works in stream?"
    wording_source: app_public_bundle
    verified_against_app: true
    source: "app public bundle, c5a15e8ebf91, 2026-09-26"
    feature: null
    fhir: { code_system: oah, code: morophology }
  - id: water_height_m
    section: water
    type: number
    name: "Water height"
    text: "What is the water height?"
    unit: m
    wording_source: app_public_bundle
    verified_against_app: true
    source: "app public bundle, c5a15e8ebf91, 2026-09-26"
    feature: null
    fhir: { code_system: oah, code: hydrology, unit: m }
  - id: impervious_left
    section: margins
    type: yesno
    short_label: "a paved left margin"
    name: "Impervious Areas (Left)"
    text: "Is more than one third of the left margin covered by impervious areas (such as roads, sidewalks or buildings)?"
    wording_source: app_public_bundle
    verified_against_app: true
    source: "app public bundle, c5a15e8ebf91, 2026-09-26"
    feature: null
    fhir: { code_system: oah, code: LandUse }
  - id: impervious_right
    section: margins
    type: yesno
    short_label: "a paved right margin"
    name: "Impervious Areas (Right)"
    text: "Is more than one third of the right margin covered by impervious areas (such as roads, sidewalks or buildings)?"
    wording_source: app_public_bundle
    verified_against_app: true
    source: "app public bundle, c5a15e8ebf91, 2026-09-26"
    feature: null
    fhir: { code_system: oah, code: LandUse }
  - id: vegetation_left
    section: margins
    type: yesno
    name: "Vegetation (Left)"
    text: "Is the left margin covered by vegetation?"
    wording_source: app_public_bundle
    verified_against_app: true
    source: "app public bundle, c5a15e8ebf91, 2026-09-26"
    feature: null
    fhir: { code_system: oah, code: riparianVegetation }
  - id: vegetation_right
    section: margins
    type: yesno
    name: "Vegetation (Right)"
    text: "Is the right margin covered by vegetation?"
    wording_source: app_public_bundle
    verified_against_app: true
    source: "app public bundle, c5a15e8ebf91, 2026-09-26"
    feature: null
    fhir: { code_system: oah, code: riparianVegetation }
  - id: vegetation_type_left
    section: margins
    type: choice
    name: "Vegetation Type (Left)"
    text: "Which vegetation is dominant (meaning that it covers more than 50%, or half) in the left margin (first 5 meters from the channel banktop)?"
    options:
      - { id: herbs, label: "Herbs", value: herbaceous }
      - { id: shrubs, label: "Shrubs", value: bushes }
      - { id: trees, label: "Trees", value: trees }
      - { id: not_sure, label: "I’m not sure", value: cant_tell }
    wording_source: app_public_bundle
    verified_against_app: true
    source: "app public bundle, c5a15e8ebf91, 2026-09-26"
    feature: null
    fhir: { code_system: oah, code: riparianVegetation }
  - id: vegetation_type_right
    section: margins
    type: choice
    name: "Vegetation Type (Right)"
    text: "Which vegetation is dominant (meaning that it covers more than 50%, or half) in the right margin (first 5 meters from the channel bank/top)?"
