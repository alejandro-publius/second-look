# Strings the reading age check leaves alone, with the reason. Keep this list short.
# A long list means the writing got harder, not that the rule got wrong.
#
# Run: uv run python scripts/check_readability.py --worst 20
exceptions:
  form.yaml.items[23].text: >-
    The official OneAquaHealth Citizen Science App's own question, word for word, from its public
    translation bundle (docs/notes/app_strings.md). Changing it would break the promise that our
    creek check asks their questions, and make app-strings-check would fail. Not ours to simplify.
